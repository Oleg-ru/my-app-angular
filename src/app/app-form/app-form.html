<div class="form_root">
  <form [formGroup]="profileForm" (ngSubmit)="handleSubmit()" class="form_container">
    <label>
      <p>Name:</p>
      <input type="text" formControlName="name">
    </label>
    <label>
      <p>Email:</p>
      <input type="email" formControlName="email">
    </label>
    <button type="submit" class="btn_submit" [disabled]="!profileForm.valid">Submit</button>
  </form>
  <div class="data_container">
    <h2>Profile Data</h2>
    <p>Name: {{profileForm.value.name}}</p>
    <p>Email: {{profileForm.value.email}}</p>
  </div>

</div>
